<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>식단기록 — A4 한달치 인쇄용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
@page { size: A4 landscape; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sage: #6b8f6b;
  --sage-dark: #3d5c3d;
  --sage-light: #eef4ee;
  --sage-mid: #c8dcc8;
  --warm: #f7f5f0;
  --border: #ccc;
  --text: #1a1a1a;
  --muted: #666;
}
body {
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  font-size: 7pt;
  color: var(--text);
  background: white;
  line-height: 1.4;
}

/* A4 가로 시트 — 2장 나란히 */
.a4-sheet {
  width: 297mm;
  height: 210mm;
  display: flex;
  flex-direction: row;
  page-break-after: always;
  overflow: hidden;
}
.daily-slot {
  width: 148.5mm;
  height: 210mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
.daily-slot:first-child {
  border-right: 0.8pt dashed #bbb;
}

/* ── DAILY PAGE ─────────────────────────── */
.daily-page {
  width: 130mm;
  height: 196mm;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0.7mm;
  padding: 0;
}

.daily-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--sage);
  padding-bottom: 1.5mm;
  flex-shrink: 0;
}
.date-field {
  display: flex;
  align-items: center;
  gap: 2mm;
  font-size: 10pt;
  font-weight: 700;
  color: var(--sage-dark);
}
.date-field .uline {
  display: inline-block;
  width: 36mm;
  border-bottom: 1.5px solid var(--text);
}

/* Meal box */
.meal-box {
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 46mm;
  flex-shrink: 0;
  height: 33mm;
  overflow: hidden;
}
.meal-food {
  border-right: 1px solid var(--border);
  padding: 2mm 3mm;
  display: flex;
  flex-direction: column;
}
.meal-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5mm;
}
.meal-name {
  font-size: 8.5pt;
  font-weight: 700;
  color: var(--sage-dark);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.meal-time {
  font-size: 7pt;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 1mm;
}
.tuline { display: inline-block; width: 14mm; border-bottom: 1px solid #aaa; }
.wlines { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
.wl { border-bottom: 1px solid #e0e0e0; }
.macro-boxes {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 1.5mm; margin-top: 1mm; min-height: 0;
}
.macro-box {
  border: 1px solid var(--sage-mid); border-radius: 1mm;
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}
.macro-box-hd {
  background: var(--sage-light); font-size: 5.5pt; font-weight: 700;
  color: var(--sage-dark); padding: 0.8mm 1.5mm; text-align: center;
  border-bottom: 1px solid var(--sage-mid); flex-shrink: 0;
}
.macro-box-body {
  flex: 1; display: flex; flex-direction: column;
  justify-content: space-evenly; padding: 0 1.5mm;
}
.macro-wl { border-bottom: 0.5px solid #e0e0e0; }

/* Symptoms panel */
.meal-sym {
  padding: 2mm 2.5mm;
  background: var(--warm);
  display: flex;
  flex-direction: column;
}
.sym-hd {
  font-size: 5.8pt;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 2mm;
}
.sym-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2mm 2mm;
  flex: 1;
}
.si {
  display: flex;
  align-items: center;
  gap: 1.2mm;
  font-size: 7pt;
  white-space: nowrap;
}
.cb {
  width: 3mm;
  height: 3mm;
  border: 1.2px solid #777;
  display: inline-block;
  flex-shrink: 0;
}
.sev-row {
  margin-top: 2mm;
  border-top: 1px solid var(--border);
  padding-top: 1.5mm;
}
.sev-lbl { font-size: 5.5pt; color: var(--muted); margin-bottom: 1mm; }
.dot {
  width: 3.5mm;
  height: 3.5mm;
  border: 1.2px solid #777;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

/* Snacks */
.snacks-box {
  border: 1px solid var(--border);
  padding: 1mm 2mm;
  flex-shrink: 0;
  height: 11mm;
  display: flex;
  align-items: flex-start;
  gap: 3mm;
}
.snacks-name {
  font-size: 7pt;
  font-weight: 700;
  color: var(--sage-dark);
  white-space: nowrap;
  min-width: 30mm;
}

/* Daily Trackers */
.trackers-box {
  border: 1.5px solid var(--sage);
  padding: 1.5mm 3mm;
  background: var(--sage-light);
  flex: 1;
  min-height: 0;
}
.tr-hd {
  font-size: 7pt;
  font-weight: 700;
  color: var(--sage-dark);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 1.5mm;
  display: flex;
  align-items: center;
  gap: 2mm;
}
.tr-hd::after { content: ''; flex: 1; height: 1px; background: var(--sage-mid); }
.tr-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2mm 6mm;
}
.tr-row { display: flex; align-items: center; gap: 1.5mm; font-size: 7.5pt; }
.tr-lbl {
  font-size: 7pt;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
  min-width: 20mm;
}
.tr-uline { flex: 1; border-bottom: 1px solid #aaa; min-width: 15mm; }
.full-col { grid-column: 1 / -1; }

/* ── PRINT ──────────────────────────────── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body>

          <div class="si"><span class="cb"></span>속쓰림</div>
          <div class="si"><span class="cb"></span>가스참</div>
          <div class="si"><span class="cb"></span>통증</div>
        </div>
        <div style="margin-top:2mm;padding-top:1.5mm;border-top:1px solid var(--border);">

const DAYS = 31;
const template = document.getElementById('daily-template');
const content = document.getElementById('content');

for (let i = 0; i < Math.ceil(DAYS / 2); i++) {
  const sheet = document.createElement('div');
  sheet.className = 'a4-sheet';

  const slot1 = document.createElement('div');
  slot1.className = 'daily-slot';
  slot1.appendChild(template.content.cloneNode(true));
  sheet.appendChild(slot1);

  const slot2 = document.createElement('div');
  slot2.className = 'daily-slot';
  if (i * 2 + 1 < DAYS) {

  }
  sheet.appendChild(slot2);

  content.appendChild(sheet);
}
