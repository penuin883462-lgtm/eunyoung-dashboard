<script>
  /* ?? ???꾪솚 ?? */
  function switchTab(tab, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-main', 'active-dental', 'active-fm'));
    document.getElementById('page-' + tab).classList.add('active');
    if (tab === 'main') {
      btn.classList.add('active-main');
      document.getElementById('scroll-btn').style.display = '';
    } else if (tab === 'fm') {
      btn.classList.add('active-fm');
      document.getElementById('scroll-btn').style.display = 'none';
    } else {
      btn.classList.add('active-dental');
      document.getElementById('scroll-btn').style.display = 'none';
    }
    window.scrollTo(0, 0);
  }

  /* ?? ?좎씪 泥댄겕 ?? */
  function toggleTask(id) {
    const saved = JSON.parse(localStorage.getItem('tasks-eunyoung') || '{}');
    saved[id] = !saved[id];
    localStorage.setItem('tasks-eunyoung', JSON.stringify(saved));
    applyAll(saved);
  }
  function applyAll(saved) {
    document.querySelectorAll('.task-item').forEach(el => {
      el.classList.toggle('done', !!saved[el.dataset.id]);
    });
    ['t1','t2','t3','t4','t5','t6'].forEach(id => {
      const b = document.getElementById('status-' + id);
      if (!b) return;
      b.textContent = saved[id] ? '???꾨즺' : '誘몄셿猷?;
      b.className = 'badge ' + (saved[id] ? 'badge-done' : 'badge-todo');
    });
    const done = Object.values(saved).filter(Boolean).length;
    const c = document.querySelector('.stat-num.green');
    if (c) c.textContent = done;
    const fill = document.querySelector('.progress-fill');
    const lbl  = document.querySelector('.progress-label span:last-child');
    const pt = saved['t4'] ? 1 : 0;
    if (fill) fill.style.width = (pt * 6.25) + '%';
    if (lbl)  lbl.textContent = pt + ' / 16??;
  }
  document.addEventListener('DOMContentLoaded', () => {
    applyAll(JSON.parse(localStorage.getItem('tasks-eunyoung') || '{}'));
  });

  /* ?? ?곸뼱 臾몄옣 ?꾪꽣 ?? */
  let currentCat = 'all';
  function filterPhrases() {
    const kw = document.getElementById('phraseSearch').value.toLowerCase();
    document.querySelectorAll('#phraseBody tr').forEach(row => {
      const match = (currentCat === 'all' || row.dataset.cat === currentCat)
                 && (!kw || row.textContent.toLowerCase().includes(kw));
      row.classList.toggle('hidden', !match);
    });
  }
  function filterCat(cat, el) {
    currentCat = cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    filterPhrases();
  }

  function switchAge(age, el) {
    document.querySelectorAll('.stom-age').forEach(c => c.classList.add('hidden'));
    document.getElementById('stom-' + age).classList.remove('hidden');
    el.closest('.cat-tabs').querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
