<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eunyoung.ooo</title>
  <meta name="description" content="치과의사, 두 아이 엄마, 기능의학 공부 중.">
  <meta property="og:title" content="eunyoung.ooo">
  <meta property="og:description" content="치과의사, 두 아이 엄마, 기능의학 공부 중.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:       #f9f7f4;
      --surface:  #ffffff;
      --text:     #1c1a18;
      --soft:     #6b6460;
      --lighter:  #9e9892;
      --accent:   #3a6350;
      --border:   #e8e2db;
      --r:        16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 580px; margin: 0 auto; padding: 0 24px; }

    /* ── HERO ── */
    .hero { padding: 64px 0 48px; text-align: center; }

    .avatar-ring {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #71b89a);
      padding: 3px;
      margin: 0 auto 22px;
      display: block;
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }

    .hero-name {
      font-family: 'Noto Serif KR', serif;
      font-size: 26px; font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
    }

    .tag-row {
      display: flex; flex-wrap: wrap;
      justify-content: center; gap: 6px;
    }
    .tag {
      font-size: 11px; font-weight: 500;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--soft);
      letter-spacing: 0.02em;
    }
    .tag.green {
      background: #edf4f0;
      border-color: #c3ddd4;
      color: var(--accent);
    }

    /* ── DIVIDER ── */
    .divider { height: 1px; background: var(--border); margin: 40px 0; }

    /* ── SECTION ── */
    .sec { margin-bottom: 44px; }

    .sec-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .body { font-size: 15px; line-height: 1.9; color: var(--text); }

    /* ── LINK CARDS ── */
    .link-card {
      display: flex; align-items: center; gap: 16px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      text-decoration: none;
      color: var(--text);
      transition: all 0.15s;
      margin-bottom: 10px;
    }
    .link-card:last-child { margin-bottom: 0; }
    .link-card:hover {
      border-color: #c3ddd4;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(58,99,80,0.1);
    }
    .link-icon {
      width: 44px; height: 44px;
      border-radius: 12px; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .link-info { flex: 1; min-width: 0; }
    .link-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .link-desc { font-size: 12px; color: var(--soft); }
    .link-arrow { color: var(--lighter); font-size: 16px; flex-shrink: 0; }

    /* ── EDU ── */
    .edu-list { list-style: none; }
    .edu-item {
      display: flex; gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .edu-item:first-child { padding-top: 0; }
    .edu-item:last-child { border-bottom: none; padding-bottom: 0; }
    .edu-bullet {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0; margin-top: 8px;
    }
    .edu-name { font-size: 14px; font-weight: 600; }
    .edu-sub { font-size: 12px; color: var(--soft); margin-top: 2px; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 28px 0 56px;
      font-size: 12px;
      color: var(--lighter);
    }
    .footer a {
      color: var(--lighter);
      text-decoration: none;
    }
    .footer a:hover { color: var(--soft); }
  </style>
</head>
<body>
<div class="wrap">

  <!-- HERO -->
  <section class="hero">
    <div class="avatar-ring">
      <div class="avatar-inner">
        <!-- 사진 넣으려면: <img src="photo.jpg" alt="은영"> -->
        🌿
      </div>
    </div>

    <h1 class="hero-name">은영</h1>

    <div class="tag-row">
      <span class="tag green">치과의사</span>
      <span class="tag green">기능의학 공부 중</span>
      <span class="tag">두 아이 엄마</span>
    </div>
  </section>

  <div class="divider"></div>

  <!-- WRITING -->
  <section class="sec">
    <p class="sec-label">글을 씁니다</p>

    <a href="https://brunch.co.kr/@dreamtreeee" target="_blank" rel="noopener" class="link-card">
      <div class="link-icon">✍️</div>
      <div class="link-info">
        <div class="link-name">브런치 @dreamtreeee</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a href="http://blog.naver.com/penuin2" target="_blank" rel="noopener" class="link-card">
      <div class="link-icon">📔</div>
      <div class="link-info">
        <div class="link-name">네이버 블로그</div>
      </div>
      <span class="link-arrow">→</span>
    </a>
  </section>

  <!-- BACKGROUND -->
  <section class="sec">
    <p class="sec-label">배경</p>
    <ul class="edu-list">
      <li class="edu-item">
        <div class="edu-bullet"></div>
        <div>
          <div class="edu-name">연세대학교 건축공학과</div>
          <div class="edu-sub">학사</div>
        </div>
      </li>
      <li class="edu-item">
        <div class="edu-bullet"></div>
        <div>
          <div class="edu-name">경희대학교 치의학전문대학원</div>
          <div class="edu-sub">D.D.S. · D.M.D</div>
        </div>
      </li>
      <li class="edu-item">
        <div class="edu-bullet"></div>
        <div>
          <div class="edu-name">IFM 기능의학 인증의</div>
          <div class="edu-sub">AFMCP 수료 중</div>
        </div>
      </li>
    </ul>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <a href="https://instagram.com/eunyoung.ooo" target="_blank" rel="noopener">@eunyoung.ooo</a>
  </footer>

</div>
</body>
</html>
